name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'

    - name: Restore dependencies
      run: dotnet restore TestTarifffs.slnx

    - name: Build Solution
      run: dotnet build TestTarifffs.slnx --no-restore --configuration Release

    - name: Run Unit Tests Natively with Coverage
      # Appends MTP coverage arguments to generate the cobertura XML file
      run: dotnet run --project RecordApp.Tests/RecordApp.Tests.csproj --no-build --configuration Release -- --coverage --coverage-output-format cobertura

    - name: Install ReportGenerator Tool
      # Installs the tool needed to turn raw coverage XML data into readable HTML pages
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate HTML Coverage Report
      # Converts any Cobertura XML file into a human-readable web folder
      run: reportgenerator -reports:"**/*.cobertura.xml" -targetdir:"coveragereport" -reporttypes:Html

    - name: Upload Coverage Report Artifact
      # This automated step grabs your folder and safely saves it to GitHub for you to download
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: coveragereport/
