name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'

    - name: Restore dependencies
      run: dotnet restore TestTarifffs.slnx

    - name: Build Solution
      run: dotnet build TestTarifffs.slnx --no-restore --configuration Release

    - name: Run Unit Tests Natively
      # This bypasses the broken dotnet test orchestrator and runs the executable tests directly
      run: dotnet run --project RecordApp.Tests/RecordApp.Tests.csproj --no-build --configuration Release
